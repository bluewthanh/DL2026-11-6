# Shared protocol for every model. Do not edit for one model; use --set for ablations.
# Unlisted settings are Ultralytics defaults (saved per run in args.yaml).

dataset:
  source: dataset/aquarium.v2-release.yolov8
  yolo_view: data/aquarium-v2-yolo
  coco_dir: data/aquarium-v2-coco
  # Same policy as scripts/data/yolo_to_coco.py (see DATA.md).
  invalid_policy: omit-known-zero-boxes

train:
  epochs: 100
  patience: 0            # no early stopping: same budget for every model
  imgsz: 640
  batch: 16
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 3
  cos_lr: false
  close_mosaic: 10
  seed: 0
  deterministic: true
  amp: true
  cache: false           # RAM cache is non-deterministic in Ultralytics
  workers: 8
  pretrained: true
  plots: true

eval:
  imgsz: 640
  batch: 16
  conf: 0.001            # low floor so AP covers the full ranking
  iou: 0.7
  max_det: 300
  quantize: null         # FP32
  splits: [val, test]

benchmark:
  imgsz: 640
  batch: 1
  conf: 0.25             # deployment threshold; post-processing time depends on it
  iou: 0.7
  max_det: 300
  precisions: [fp32, fp16]
  warmup: 30
  images: 127            # first N sorted validation images
  repeats: 3
